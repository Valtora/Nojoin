# Trivy secret-scanner configuration for the release gate (scripts/release.py).
#
# Each allow rule skips one path for every secret rule, so keep them narrow and
# say why the match is not a secret. Vulnerability exceptions live in
# .github/trivyignore instead.
allow-rules:
  # anthropic 1.14.0 documents an agent's execution identity as a JSON object
  # whose type is service_account, and that key-value pair is the whole of
  # what Trivy's gcp-service-account rule matches. These are docstrings in a
  # vendored SDK, not credentials. Added 2026-10-14.
  #
  # Never quote the matched text in this file: it is copied into the api and
  # worker images and would be flagged in turn.
  - id: anthropic-sdk-docstrings
    description: anthropic SDK docstrings that quote a service-account type
    path: /site-packages/anthropic/
