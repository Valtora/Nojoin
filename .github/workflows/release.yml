name: Release & Publish

# The images are built, scanned and smoke tested on the release host by
# scripts/release.py, which pushes them and then this tag. This workflow
# checks each image was built from the tag's commit, signs it with the
# workflow's OIDC identity, moves the rolling tags and writes the release.
# See "Release Workflow" in docs/DEVELOPMENT.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release tag to publish (must match vX.Y.Z)
        required: true
        type: string
      publish_latest:
        description: Also publish the latest tag for this manual release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-release-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      image_base: ${{ steps.release.outputs.image_base }}
      major_minor: ${{ steps.release.outputs.major_minor }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Validate tag format and docs version
        id: release
        shell: bash
        env:
          RELEASE_REF_INPUT: ${{ inputs.release_ref }}
          PUBLISH_LATEST_INPUT: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${RELEASE_REF_INPUT}"
            if ! git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
              echo "workflow_dispatch release_ref must point to an existing tag: ${tag_name}" >&2
              exit 1
            fi
            release_ref="refs/tags/${tag_name}"
            publish_latest="${PUBLISH_LATEST_INPUT}"
          else
            tag_name="${GITHUB_REF_NAME}"
            release_ref="${GITHUB_REF}"
            publish_latest="true"
          fi

          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match strict vX.Y.Z semver. Got: ${tag_name}" >&2
            exit 1
          fi

          version="${tag_name#v}"
          docs_version="$(tr -d '[:space:]' < docs/VERSION)"
          if [[ "${docs_version}" != "${version}" ]]; then
            echo "docs/VERSION (${docs_version}) does not match release tag (${version})." >&2
            exit 1
          fi

          # Container repositories must be lowercase; github.repository can be
          # mixed case, so derive a lowercase image base for every direct ref.
          image_base="$(printf '%s/%s' "${REGISTRY}" "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse "${release_ref}^{commit}")" >> "${GITHUB_OUTPUT}"
          echo "release_ref=${release_ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${version%.*}" >> "${GITHUB_OUTPUT}"
          echo "publish_latest=${publish_latest}" >> "${GITHUB_OUTPUT}"
          echo "image_base=${image_base}" >> "${GITHUB_OUTPUT}"

  sign-images:
    name: Verify & sign images
    needs: validate-release-ref
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing via the GitHub OIDC token.
      id-token: write

    outputs:
      digests: ${{ steps.verify.outputs.digests }}

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Every image must already be on GHCR under both immutable tags, carry its
      # provenance and SBOM, and say it was built from this tag's commit. All
      # four are checked before any is signed, so a half-pushed release signs
      # nothing.
      - name: Verify images were built from this tag
        id: verify
        env:
          IMAGE_BASE: ${{ needs.validate-release-ref.outputs.image_base }}
          VERSION: ${{ needs.validate-release-ref.outputs.version }}
          COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
        run: |
          set -euo pipefail
          digests='{}'
          for suffix in -api -worker -worker-io -frontend; do
            ref="${IMAGE_BASE}${suffix}:${VERSION}"
            if ! manifest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}')"; then
              echo "::error::${ref} is not on GHCR. Run scripts/release.py, which builds and pushes the images before it pushes the tag." >&2
              exit 1
            fi
            digest="$(jq -r .digest <<<"${manifest}")"
            pinned="${IMAGE_BASE}${suffix}@${digest}"

            revision="$(docker buildx imagetools inspect "${pinned}" --format '{{json .Image}}' \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')"
            if [[ "${revision}" != "${COMMIT}" ]]; then
              echo "::error::${ref} was built from '${revision}', not ${COMMIT}." >&2
              exit 1
            fi

            sha_digest="$(docker buildx imagetools inspect "${IMAGE_BASE}${suffix}:sha-${COMMIT:0:7}" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ "${sha_digest}" != "${digest}" ]]; then
              echo "::error::${IMAGE_BASE}${suffix}:sha-${COMMIT:0:7} is not ${pinned}." >&2
              exit 1
            fi

            docker buildx imagetools inspect "${pinned}" --format '{{json .Provenance}}' \
              | jq -e '.SLSA' >/dev/null || { echo "::error::${pinned} has no provenance." >&2; exit 1; }
            docker buildx imagetools inspect "${pinned}" --format '{{json .SBOM}}' \
              | jq -e '.SPDX' >/dev/null || { echo "::error::${pinned} has no SBOM." >&2; exit 1; }

            echo "${pinned}: built from ${COMMIT}, provenance and SBOM present"
            digests="$(jq -c --arg s "${suffix}" --arg d "${digest}" '. + {($s): $d}' <<<"${digests}")"
          done
          echo "digests=${digests}" >> "${GITHUB_OUTPUT}"

      - name: Sign images with cosign (keyless)
        env:
          IMAGE_BASE: ${{ needs.validate-release-ref.outputs.image_base }}
          DIGESTS: ${{ steps.verify.outputs.digests }}
        run: |
          set -euo pipefail
          # Keyless signing binds each signature to this workflow's OIDC
          # identity; no long-lived private key is stored. Signing by digest
          # covers every tag that resolves to the image.
          for suffix in -api -worker -worker-io -frontend; do
            cosign sign --yes "${IMAGE_BASE}${suffix}@$(jq -r --arg s "${suffix}" '.[$s]' <<<"${DIGESTS}")"
          done

  publish-mutable-tags:
    name: Publish rolling tags
    needs:
      - validate-release-ref
      - sign-images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Promote the verified, signed digests to the rolling tags. major.minor
      # always advances on a successful release; latest only advances when the
      # release flow authorised it. cosign signatures attach to the digest, so
      # these tags inherit the existing signature without re-signing.
      - name: Promote rolling tags from the signed digests
        env:
          IMAGE_BASE: ${{ needs.validate-release-ref.outputs.image_base }}
          MAJOR_MINOR: ${{ needs.validate-release-ref.outputs.major_minor }}
          PUBLISH_LATEST: ${{ needs.validate-release-ref.outputs.publish_latest }}
          DIGESTS: ${{ needs.sign-images.outputs.digests }}
        run: |
          set -euo pipefail
          for suffix in -api -worker -worker-io -frontend; do
            digest="$(jq -r --arg s "${suffix}" '.[$s]' <<<"${DIGESTS}")"
            tags=( "--tag" "${IMAGE_BASE}${suffix}:${MAJOR_MINOR}" )
            if [[ "${PUBLISH_LATEST}" == "true" ]]; then
              tags+=( "--tag" "${IMAGE_BASE}${suffix}:latest" )
            fi
            docker buildx imagetools create "${tags[@]}" "${IMAGE_BASE}${suffix}@${digest}"
          done

  publish-release-notes:
    name: Publish release notes
    needs:
      - validate-release-ref
      - publish-mutable-tags
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required to compute the previous-tag..this-tag range.
          fetch-depth: 0
          ref: ${{ needs.validate-release-ref.outputs.release_ref }}

      - name: Render release notes
        id: notes
        env:
          IMAGE_BASE: ${{ needs.validate-release-ref.outputs.image_base }}
          TAG: ${{ needs.validate-release-ref.outputs.tag_name }}
          VERSION: ${{ needs.validate-release-ref.outputs.version }}
        run: |
          set -euo pipefail

          # Resolve the previous release tag reachable from this tag. The range is
          # exactly previous-tag..this-tag; fall back to full history
          # for the very first release.
          if prev_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null)"; then
            range="${prev_tag}..${TAG}"
            echo "Changelog range: ${range}"
          else
            range="${TAG}"
            echo "No previous tag found; using full history."
          fi

          # Render a categorised, human-readable changelog (grouped by Conventional
          # Commit type, with internal churn folded away). The script emits a
          # "No notable changes." line for an empty range, so the release never
          # fails on changelog generation.
          #
          # The checkout is the release ref, so a workflow_dispatch backfill of a
          # tag cut before this script existed will not contain it. Fall back to a
          # flat commit list in that case rather than failing the notes job after
          # the rolling image tags have already published.
          if [[ -f scripts/render_release_notes.py ]]; then
            python3 scripts/render_release_notes.py "${range}" > changelog.txt
          else
            git log --no-merges --pretty=format:'- %s (%h)' "${range}" > changelog.txt
            [[ -s changelog.txt ]] || echo "- No notable changes." > changelog.txt
          fi

          # Resolve the published image digests for reproducible-pin guidance.
          : > image-digests.txt
          for suffix in -api -worker -worker-io -frontend; do
            digest="$(docker buildx imagetools inspect "${IMAGE_BASE}${suffix}:${VERSION}" \
              --format '{{ .Manifest.Digest }}' 2>/dev/null || echo unknown)"
            printf -- '- `%s%s@%s`\n' "${IMAGE_BASE}" "${suffix}" "${digest}" >> image-digests.txt
          done

          python3 - <<'PY'
          import os

          version = os.environ["VERSION"]
          template = open(".github/release-notes-template.md", encoding="utf-8").read()
          changelog = open("changelog.txt", encoding="utf-8").read().strip()
          digests = open("image-digests.txt", encoding="utf-8").read().strip()

          body = (
              template
              .replace("{{VERSION}}", version)
              .replace("{{IMAGE_DIGESTS}}", digests)
              .replace("{{CHANGELOG}}", changelog)
          )
          with open("release-notes.md", "w", encoding="utf-8") as handle:
              handle.write(body)
          PY

          echo "Rendered release notes:"
          cat release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-release-ref.outputs.tag_name }}
          name: Nojoin ${{ needs.validate-release-ref.outputs.version }}
          body_path: release-notes.md
          make_latest: ${{ needs.validate-release-ref.outputs.publish_latest }}
