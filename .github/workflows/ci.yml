name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # Classify the diff so the heavy jobs only run when their area changed. The
  # expensive jobs below gate on these outputs; the cheap validators always run.
  # `CI gate` (the single required status check) aggregates every result, so a
  # skipped job never leaves a required check permanently pending.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
      deployment: ${{ steps.filter.outputs.deployment }}
      telemetry: ${{ steps.filter.outputs.telemetry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets paths-filter diff push events (e.g. pushes to main)
          # via git; pull_request events are diffed through the API.
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # `deployment` covers infrastructure the code filters do not: Dockerfiles,
          # compose, and nginx affect the built images, so a change runs the full
          # backend and frontend suite. Only this CI workflow is included from
          # `.github/workflows/` — it defines the suites, so editing it must
          # re-exercise everything. Other workflows (e.g. the tag-driven release
          # pipeline) cannot be validated by the unit suites and run on their own
          # triggers, so they are not gated here.
          #
          # `scripts` runs only the Python quality gate (lint, format, mypy, and the
          # validators) — not the full pytest suite — since scripts/ are standalone
          # tooling the backend tests do not import.
          filters: |
            backend:
              - 'backend/**'
              - 'requirements/**'
              - 'pyproject.toml'
            frontend:
              - 'frontend/**'
            scripts:
              - 'scripts/**'
            deployment:
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'nginx/**'
              - '.github/workflows/ci.yml'
            telemetry:
              - 'telemetry/**'

  backend-tests:
    name: Backend tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Run backend tests
        run: pytest

  python-quality:
    name: Python quality
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' || needs.detect-changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/backend.txt
            requirements/lint.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/backend.txt -r requirements/lint.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Check source file size
        run: python scripts/check_file_size.py

      - name: Type-check stable boundaries
        run: mypy

  frontend-lint:
    name: Frontend lint
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

  frontend-unit-tests:
    name: Frontend unit tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test

  frontend-build:
    name: Frontend build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build

  telemetry-worker:
    # The telemetry ingest is the one place a bug is invisible from the app: a
    # broken validator would silently drop real pings rather than fail loudly.
    # Only tsc and vitest run here — wrangler needs Node 22, and the Worker's
    # decision surface (payload validation, retention SQL) is deliberately free
    # of Worker runtime APIs so it tests on plain Node.
    name: Telemetry worker
    needs: detect-changes
    if: needs.detect-changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: telemetry/package-lock.json

      - name: Install telemetry dependencies
        working-directory: telemetry
        run: npm ci

      - name: Type-check the telemetry worker
        working-directory: telemetry
        run: npm run typecheck

      - name: Run telemetry worker tests
        working-directory: telemetry
        run: npm test

  docs-validation:
    name: Docs validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate documentation links
        run: python scripts/validate_docs.py

  alembic-validation:
    name: Alembic validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate checked-in Alembic graph
        run: python scripts/validate_alembic.py

  whitespace:
    # Always run: this is the only trailing-whitespace guard for Markdown, YAML,
    # shell, and config files, which the path-gated Python quality job no longer
    # covers on a non-backend change. The script is pure stdlib, so it is cheap.
    name: Whitespace check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check trailing whitespace
        run: python scripts/check_whitespace.py

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Informational on pull requests: surfaces dependency and config CVEs in
      # the repository without blocking merges. The release pipeline enforces
      # the blocking image scan and severity policy (REL-008).
      - name: Scan repository dependencies and config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

  # Single required status check. It depends on every meaningful job and passes
  # only if none of them failed or were cancelled; a job that was skipped by the
  # path filter counts as a pass. Branch protection requires this context (and
  # only this one), so a required check is always reported even when the heavy
  # jobs are skipped, which a per-job `paths` filter could never guarantee.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - detect-changes
      - backend-tests
      - python-quality
      - frontend-lint
      - frontend-unit-tests
      - frontend-build
      - telemetry-worker
      - docs-validation
      - alembic-validation
      - whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "A required job did not pass (result: ${result})." >&2
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
