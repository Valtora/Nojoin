# Included by every location in the HTTPS server of nginx.conf.
#
# nginx copies server-level add_header directives into a location only when
# that location sets none of its own, and each location here sets its own
# headers, so the header has to be included in each one.
#
# No includeSubDomains: an install on a subdomain must not force HTTPS on its
# sibling hosts. Browsers ignore the header on a connection with a certificate
# error, so it takes effect behind an edge proxy with a trusted certificate,
# which passes it through.
add_header Strict-Transport-Security "max-age=31536000" always;
