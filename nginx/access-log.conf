# The bundled proxy's access log, with secrets masked. nginx.conf includes it
# in its http block.
#
# nginx's default combined format writes the request line and the Referer in
# full, and some of them carry a secret or one-time value in the query string:
# the calendar sign-in callback's code, state and session_state, an invitation
# code, an API key. Each map below masks the value of one such parameter, the
# last one not yet masked, so a chain of four covers a request that carries
# four. The names match INBOUND_SECRET_QUERY_PARAMS in
# backend/utils/url_redaction.py; backend/tests/test_access_log_redaction.py
# keeps the two lists, and every copy of the pattern here, the same.

map $request $nojoin_log_request_1 {
    "~*^(.*[?&](?:code|state|session_state|access_token|refresh_token|id_token|token|ticket|client_secret|api_key|validationtoken|invite|invite_code)=)(?!<redacted>)[^&#\s]+(.*)$" "$1<redacted>$2";
    default $request;
}

map $nojoin_log_request_1 $nojoin_log_request_2 {
    "~*^(.*[?&](?:code|state|session_state|access_token|refresh_token|id_token|token|ticket|client_secret|api_key|validationtoken|invite|invite_code)=)(?!<redacted>)[^&#\s]+(.*)$" "$1<redacted>$2";
    default $nojoin_log_request_1;
}

map $nojoin_log_request_2 $nojoin_log_request_3 {
    "~*^(.*[?&](?:code|state|session_state|access_token|refresh_token|id_token|token|ticket|client_secret|api_key|validationtoken|invite|invite_code)=)(?!<redacted>)[^&#\s]+(.*)$" "$1<redacted>$2";
    default $nojoin_log_request_2;
}

map $nojoin_log_request_3 $nojoin_log_request_4 {
    "~*^(.*[?&](?:code|state|session_state|access_token|refresh_token|id_token|token|ticket|client_secret|api_key|validationtoken|invite|invite_code)=)(?!<redacted>)[^&#\s]+(.*)$" "$1<redacted>$2";
    default $nojoin_log_request_3;
}

# The invitation check takes its code in the path,
# /api/v1/invitations/validate/<code>.
map $nojoin_log_request_4 $nojoin_log_request {
    "~^(.*/invitations/validate/)[^/?#\s]+(.*)$" "$1<redacted>$2";
    "" "-";
    default $nojoin_log_request_4;
}

# A page's own URL comes back as the Referer of every request it makes: the
# invitation page's, and the MCP consent page's, which carries the client's
# state.
map $http_referer $nojoin_log_referer_1 {
    "~*^(.*[?&](?:code|state|session_state|access_token|refresh_token|id_token|token|ticket|client_secret|api_key|validationtoken|invite|invite_code)=)(?!<redacted>)[^&#\s]+(.*)$" "$1<redacted>$2";
    default $http_referer;
}

map $nojoin_log_referer_1 $nojoin_log_referer {
    "~*^(.*[?&](?:code|state|session_state|access_token|refresh_token|id_token|token|ticket|client_secret|api_key|validationtoken|invite|invite_code)=)(?!<redacted>)[^&#\s]+(.*)$" "$1<redacted>$2";
    "" "-";
    default $nojoin_log_referer_1;
}

# combined, with the two masked fields in place of $request and $http_referer.
# A map's value is never "not found", so the "" entries above print the "-"
# that combined prints for a missing Referer.
log_format nojoin_combined '$remote_addr - $remote_user [$time_local] '
                           '"$nojoin_log_request" $status $body_bytes_sent '
                           '"$nojoin_log_referer" "$http_user_agent"';

access_log /var/log/nginx/access.log nojoin_combined;
