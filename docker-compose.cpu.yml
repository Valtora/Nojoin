# Explicit CPU-only inference profile. No accelerator devices are passed through.
# Apply with: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
# Add --build to build the CPU worker image locally instead of pulling it.
services:
  worker-inference:
    image: ghcr.io/valtora/nojoin-worker-cpu:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        TORCH_BASE_IMAGE: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
        WORKER_GPU_BACKEND: cpu
        TORCH_VERSION: "2.11.0"
        TORCHAUDIO_VERSION: "2.11.0"
  worker-io:
    environment:
      NOJOIN_GPU_AVAILABLE: "false"
