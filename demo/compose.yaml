# The public demo at demo.nojoin.co.uk. See README.md.
#
# Three containers and no state: the frontend built in demo mode, the fixture
# API, and nginx in front. Only nginx joins the tunnel's network; the other
# two are reachable from nginx alone.

name: nojoin-demo

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build: ./server
    image: nojoin-demo-api:local
    container_name: nojoin-demo-api
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ${DEMO_FIXTURES_DIR:-./fixtures}:/fixtures:ro
    networks: [demo]

  frontend:
    <<: *hardening
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_DEMO_MODE: "true"
    image: nojoin-demo-frontend:local
    container_name: nojoin-demo-frontend
    cap_drop: [ALL]
    networks: [demo]

  nginx:
    <<: *hardening
    image: nginx:alpine
    container_name: nojoin-demo-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, frontend]
    networks: [demo, tunnel]

networks:
  demo:
  tunnel:
    external: true
    name: ${DEMO_TUNNEL_NETWORK:-proxy_net}
