# Front door for the public demo. TLS ends at Cloudflare, which reaches this
# container through the tunnel over plain HTTP.

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_max_body_size 1m;

    # The visitor's address as Cloudflare reports it, for rate limiting.
    map $http_cf_connecting_ip $visitor {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $visitor zone=demo:10m rate=20r/s;

    server {
        listen 80;
        limit_req zone=demo burst=80 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $visitor;
        proxy_set_header X-Forwarded-Proto https;

        # Upstreams are resolved per request through Docker's DNS, so a
        # recreated container is found at its new address. A literal
        # proxy_pass would keep the address from nginx's start.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        set $frontend http://frontend:14141;

        location ~ ^/api/v1/transcripts/[^/]+/events$ {
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $visitor;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass $api;
        }

        location / {
            proxy_pass $frontend;
        }
    }
}
