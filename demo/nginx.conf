# Front door for the public demo. TLS ends at Cloudflare, which reaches this
# container through the tunnel over plain HTTP.

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_max_body_size 1m;

    # The visitor's address as Cloudflare reports it, for rate limiting.
    map $http_cf_connecting_ip $visitor {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $visitor zone=demo:10m rate=20r/s;

    server {
        listen 80;
        limit_req zone=demo burst=80 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $visitor;
        proxy_set_header X-Forwarded-Proto https;

        location /api/ {
            proxy_pass http://api:8000;
        }

        location / {
            proxy_pass http://frontend:14141;
        }
    }
}
